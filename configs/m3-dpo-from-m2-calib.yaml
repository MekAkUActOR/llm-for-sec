### model
model_name_or_path: J:\Projects\llm_for_sec\checkpoints\qwen3-06b-sec-m2-calib

### method
stage: dpo
do_train: true
finetuning_type: full
template: qwen3_nothink      # 同 M2 全链（chatml 槽位、无 think 机制；M2 已实测注册）
pref_loss: sigmoid           # docs/07 §2.2 默认；或参考 §6.1 政策对分置 beta 的后续实验
pref_beta: 0.1
                             #   条件旋钮：若 M2.5 出口 G4（行为保持）判 FAIL——
                             #   即 SFT 已把拒答推过头（ORR 激增）——发射前升到 0.2
                             #   加强隐式 KL；G4 PASS 则维持 0.1。

### dataset
dataset: sec_dpo_m3
dataset_dir: J:\Projects\llm_for_sec\data\lf
packing: false               # 偏好对逐样本（packing 会跨对拼接破坏 chosen/rejected 边界）
cutoff_len: 2048             # docs/07 未指定 cutoff；实测依据（1,000 对抽样，Qwen3
                             #   tokenizer，prompt+max(chosen,rejected)+模板开销）：
                             #   mean=308 / p95=477 / p99=540 / max=1149，>2048 占比 0；
                             #   2048 = max 的 1.8 倍防御性余量，兼多轮扩展（T10）。
preprocessing_num_workers: 8
overwrite_cache: true

### output
output_dir: J:\Projects\llm_for_sec\checkpoints\qwen3-06b-sec-m3-dpo
logging_steps: 10
save_steps: 200
save_only_model: false       # 全量 checkpoint（可中断无损续训，见头部注释）
save_total_limit: 3           # 【2026-09-30 整改】docs/01 §7.3：≥3 且每 epoch 至少一中间档。
                              # 原为 2——正因只保最近两档，M2 期 292 步校准档险些丢失，
                              # 而该档正是"安全行为学得极早、续训侵蚀泛化"的唯一证据来源。
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 1     # bs1 起步（见显存预算注）；DPO 双前向 ≈ SFT bs2 瞬时
gradient_accumulation_steps: 16    # eff 16，沿 M2 校准实测包络
learning_rate: 2.0e-6              # 【定稿 2026-09-30】docs/07 §2.2：区间 5e-7~5e-6，
                                   #   0.6B 取中偏上——对数中点 ~1.6e-6 再上一档 = 2.0e-6
num_train_epochs: 1.0              # 【定稿 2026-09-30】docs/07 §2.2：epochs 1
lr_scheduler_type: cosine
warmup_steps: 100                  # ~2,997 步的 3.3%；偏好优化常规小比例热身
weight_decay: 0.0                  # 偏好优化常规（正则无据；与 M2 SFT 的 0.1 不同属预期）
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
