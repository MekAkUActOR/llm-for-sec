###
### 显存预算（WDDM 保守包络估算，RTX 5090 D 24GB，训练中可用 ~22.3 GiB）：
###   DPO = policy + ref 双模型驻留（LF CustomDPOTrainer，trl 0.24 底座）。
###   ⚠ beta=0 不免 ref：LF 侧 ref 加载由 pref_loss 决定（hparams/finetuning_args.py
###   :616 use_ref_model = stage==dpo && pref_loss not in {orpo,simpo}），与 beta 无关；
###   trl 0.24 原生 DPOTrainer 对 sigmoid 也无条件算 ref logps（dpo_trainer.py:1745）。
###   docs/07 §2.2 无 beta=0 设计（beta 默认 0.1 即 KL 心理锚）。若确需免 ref 显存，
###   本栈唯一合法开关是 pref_loss: simpo（或 orpo）——损失族变更，需单独评审，
###   M3 不采用。（注意：M3.5 GRPOTrainer 相反，beta==0.0 官方跳过 ref——
###   grpo_trainer.py:427，勿混淆两个阶段的行为。）
###   常驻（0.6B，bf16）：policy 权重 ~1.2 + ref 权重 ~1.2（eval-only，无梯度/
###     优化器）+ 梯度 ~1.2 + AdamW fp32 双状态 ~4.8 ≈ 8.4 GB
###   瞬时峰值（bs1 @ cutoff 2048，词表 151,936）：LF concatenated_forward 将全词表
###     logits 上抛 fp32（train/dpo/trainer.py:230）+ get_batch_logps 全量
###     log_softmax（train/trainer_utils.py:612）；chosen+rejected 拼接=2 行/样本：
###     bf16 logits ~1.25 + fp32 logits ~2.5 + log_softmax 输出 ~2.5 ≈ 6.2 GB
###   激活（gradient_checkpointing 开）≈ 0.5-1 GB；WDDM 桌面+碎片 ~1.6-2 GB
###   → 峰值 ~17-18 GB，余量 ~4-5 GB（≥20%）。bs1 起步：DPO 每样本双前向，
###   bs1 ≈ SFT bs2 的瞬时占用；沿 m2-calib 实测包络纪律不冒进。
###   首次 OOM 处置序：① cutoff_len 2048→1024（实测仅 ~0.1% 对超 1024）
###   ② adam_bnb8bit: true（省 ~2.4 GB）③ 检查桌面显存占用后重试。
