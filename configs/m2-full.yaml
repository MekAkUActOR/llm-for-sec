### train
### bs1×accum16（eff 16 不变）：[2026-09-28 15:2x 改] bs2 起跑后陷入慢性轻度
### WDDM 分页（边际步时 5.8→7.7s 爬升、功耗 120-212W 波动、ETA 膨胀到 ~22h）——
### 机制 = 变长序列的分配池高水位（早期长批 2×4k logits 瞬态 7.5GB）+
### 缓存分配器不归还 + WDDM 分页区反复摩擦。C1 先例同型（bs1 反而更快）：
### bs1 砍半批瞬态（1×4k=3.7GB）+ 降分配方差 → 出分页区。
### 重启代价：~160 步（checkpoint-500 未落，净重启）。
### 环境加固：PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True（防碎片；
### 平台不支持时自动忽略，无害）
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 100
weight_decay: 0.1
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
