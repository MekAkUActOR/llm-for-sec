model_name_or_path: J:\Projects\llm_for_sec\checkpoints\soup-needlefix-a050
stage: dpo
do_train: true
finetuning_type: full
template: qwen3_nothink

dataset_dir: J:\Projects\llm_for_sec\data\m4-run
dataset: sec_dpo_m4_capfix
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 0

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-6
# ★ 跑满 1 epoch（= 1,803 步 ✓，与 M3 相同 ✓）—— 不设 max_steps
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_steps: 20
weight_decay: 0.0
optim: adamw_bnb_8bit
gradient_checkpointing: false

pref_loss: sigmoid
pref_beta: 0.1

bf16: true
logging_steps: 5
save_steps: 100
save_total_limit: 5
plot_loss: true
report_to: none
output_dir: J:\Projects\llm_for_sec\checkpoints\qwen3-06b-sec-m4-capfix-full
