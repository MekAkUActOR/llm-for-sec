# m6-lora smoke config: tiny synthetic data, LoRA v2 path mechanics check
base:
  model_name_or_path: checkpoints/qwen3-06b-sec-m5a-dpo-r5
  dtype: bf16
probe:
  tapped_layers: [4, 12, 20, 24, 28]
  token_layers: [12, 28]
  heads:
    T1: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T2: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T3: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T4:
      type: pii-dual
      doc: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
      bio: {type: token-bio, dims: [2048, 512, 23], entity_types: 11, span_merge: bio-consecutive}
      input: L12+L28-per-token-concat
      flag_rule: doc_head_or_spans_nonempty
    T5: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T6: {type: seq-mlp, dims: [1024, 256, 3], classes: 3}
  aux_ood:
    mechanism: mahalanobis
    classes: [benign, attack]
    feature: trunk_output
    fit_on: train
    lambda: 0.1
  loss:
    task_weights: {}
    bio_weight: 2.0
    bio_pos_weight: 15.0
    label_masking: true
run_id: m6-lora-smoke
data:
  train_patterns:
  - reports/m6/smoke_v2/train.jsonl
  dev_patterns:
  - reports/m6/smoke_v2/dev.jsonl
  prefix_rows: exclude
  seed: 42
train:
  max_epochs: 2
  learning_rate: 0.001
  optimizer: adamw
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 16
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  early_stop_patience: 2
  bio_max_tokens: 512
  extract_batch_rows: 8
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
    lr: 0.0005
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    layer_from: 14
    layer_to: 28
    lora_bio_extra_rows: 1
  lora_center_max_rows: 500
output_dir: checkpoints/_lora_smoke
notes: 'v2 LoRA path mechanics smoke (tiny synthetic data)'
