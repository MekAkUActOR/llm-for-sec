# v2.1 config: T1 data-effect iteration on arch's fix ruling (ADR-2b s1b
# chain). D-14 effect separation continues: guard baseline = v2 readings
# (the previous artifact), so v2.1-v2 isolates the T1-lawful + projection
# data effect under the SAME LoRA recipe. Wave: dataeng t1-lawful
# (lawful-context negatives for the mirror-shaped benign surface) +
# projection extension per arch's per-family legality table
# (near-miss full family / synth-pii+multiturn+indirect neg-only /
# pos rows unlabeled / r9-paired untouched).
base:
  model_name_or_path: checkpoints/qwen3-06b-sec-m5a-dpo-r5
  dtype: bf16
probe:
  tapped_layers: [4, 12, 20, 24, 28]
  token_layers: [12, 28]
  heads:
    T1: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T2: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T3: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T4:
      type: pii-dual
      doc: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
      bio: {type: token-bio, dims: [2048, 512, 23], entity_types: 11, span_merge: bio-consecutive}
      input: L12+L28-per-token-concat
      flag_rule: doc_head_or_spans_nonempty
    T5: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T6: {type: seq-mlp, dims: [1024, 256, 3], classes: 3}
  aux_ood:
    mechanism: mahalanobis
    classes: [benign, attack]
    feature: trunk_output
    fit_on: train
    lambda: 0.1
  loss:
    # unchanged from v2 (ADR-2b s1): the fix is DATA-side supervision, not
    # weight rebalancing (arch: consolidation walks the data path, T1 2.0
    # stays - benign-side counterweight comes from t1-lawful supervision)
    task_weights: {T1: 2.0, T2: 1.4, T3: 1.7, T4: 1.0, T5: 1.3, T6: 1.0}
    bio_weight: 2.0
    bio_pos_weight: 15.0
    label_masking: true
run_id: m6-v2-1
data:
  manifest: data/m6/manifest.json
  prefix_rows: exclude
  seed: 42
train:
  max_epochs: 5
  learning_rate: 0.001
  optimizer: adamw
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 16
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  early_stop_patience: 2
  bio_max_tokens: 512
  extract_batch_rows: 16
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    lr: 0.0001
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    layer_from: 14
    layer_to: 28
    lora_bio_extra_rows: 2
  lora_center_max_rows: 3000
  # v2 guard baseline, PLANE-CONSISTENT (arch adopted): v2 weights
  # re-measured on the NEW dev plane (12,468; logit domain; outputs/m6/
  # _v2_newplane/newplane_baseline.json). T1 0.2121 = harder-plane effect
  # (lawful-hard rows v2 never learned; v2.1's t1-lawful targets exactly
  # this). T5/T6 = 1.0 strict upper bound -- arch note: D-13 WARN+last
  # fallback covers worst case; delivery judgment unaffected.
  baseline_readings: {T1: 0.2121, T2: 0.9861, T3: 0.8396, T4: 0.9651, T5: 1.0, T6: 1.0}
output_dir: checkpoints/m6-v2-1
notes: 'v2.1 = T1 data-effect iteration (arch fix ruling: t1-lawful negatives
  + per-family projection legality table) on the SAME v2 LoRA recipe; guard
  vs v2 readings (D-14 chain: v2.1-v2 = data effect); logit-domain guard
  active; full feature re-extract REQUIRED (new rows in wave)'
