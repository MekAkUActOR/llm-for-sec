### ═══ M4c **ORPO 全长**：损失函数轴的单变量对照（第 41 轮，回顾裁决 ✓）═══
#
# ★ 设计：与 `m4-capfix-full.yaml`（已充分表征的失败 ✗）**逐字复刻**，
#   唯一科学变量 = `pref_loss: sigmoid → orpo`（所有者裁决 2026-10-07 ✓）。
#
# ★ 机制依据（LLaMA-Factory 源码核实 ✓，不猜 ✓）：
#   `trainer.py` L150-158：orpo_loss = sft_loss + beta × odds_ratio_loss
#   其中 sft_loss = −chosen_logps（**chosen 的 NLL 锚，权重 1.0** ✓）
#   ⇒ pref_beta 0.1 下 = 强锚 + 温和偏好推力 ⇒ 直接对症「chosen 似然塌缩」✓
#   （M4-full 的死因：sigmoid 无锚，chosen 被拖到起点下 36.3 nats ✗，标记先丢 ✗）
#
# ★ 与 m4-capfix-full.yaml 的全部差异（3 处，其中科学变量仅 1 处 ✓）：
#   1. pref_loss: sigmoid → orpo      ← ★唯一科学变量 ✓
#   2. save_total_limit: 5 → 20       ← 保留策略（规则 43.5 ✓：必须覆盖病态起点 bin ~800 ✗）
#   3. output_dir: …m4-capfix-full → …m4c-orpo-full   ← 必然不同 ✓
#
# ★ 口径警告（预注册 §四② ✓）：orpo/ipo/simpo 的 logps **做了长度归一化**
#   （trainer.py L234-235 ✓）⇒ 与 sigmoid 的序列求和 logps **不同尺度** ✗
#   ⇒ M4 的「rewards/chosen ≥ +1」曲线判据**口径失效，不得沿用** ✗。
#
# 数据：data/m4-run/dpo_m4_capfix.jsonl（28,842 行 ✓，与 M4-full 完全同份 ✓）
#   ⇒ dataset_info 条目 `sec_dpo_m4_capfix` 已存在 ✓（M4-full 用过 ✓）
#   ★ VERDICT 对比度审计（第 41 轮 ✓）：全混料 0.00% ⇒ 本实验**不依赖**标记对比度 ✗
#   ⇒ 若 MUST-B 过门，是**SFT 锚**的功劳，不是数据对比度的功劳 ✓（归因干净 ✓）
#
# 可中断（项目纪律 ✓）：全量 checkpoint（含优化器/调度器/RNG ✓）
