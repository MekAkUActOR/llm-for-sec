model_name_or_path: Qwen/Qwen3-8B-Base
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
template: qwen3_nothink

dataset_dir: J:\Projects\llm_for_sec\data\m5a-r6-run
dataset: sec_dpo_m5a_r6_base_m4capfix,sec_dpo_m5a_r6_p16_benign,sec_dpo_m5a_r6_p16_malicious,sec_dpo_m5a_r6_p16_r6new
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 0

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
# ★ 探针：300 步（同 r6 剂量 ≈ 1/7 epoch 口径；R6 全史 M5A 系列 2,129–2,529 步/epoch 量级）
max_steps: 300
lr_scheduler_type: cosine
warmup_steps: 20
weight_decay: 0.0
optim: adamw_bnb_8bit
gradient_checkpointing: true

pref_loss: sigmoid
pref_beta: 0.1

bf16: true
logging_steps: 5
save_steps: 50
save_total_limit: 20
plot_loss: true
report_to: none
output_dir: J:\Projects\llm_for_sec\checkpoints\qwen3-8b-sec-m5a-dpo-r7
