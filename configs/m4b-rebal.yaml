# ★ 数据集（第 34 轮落盘 ✓）
#   data/m4-run/dpo_m4_rebal.jsonl   18,171 行 / 42,129,684 B
#   sha256 = 63ED63CFE4BBFEC7352EFEA54550925685E28547014F5ADFA2AD5F10F8D924EC
#   构成：S 方向对全保留 ✓ / C 契约对全保留 ✓ / **F 风格对降权 1/4** ✓
#   梯度质量占比：F 39.4% → **14.2%** ✓，S+C 60.6% → **85.8%** ✓
#   ★ 种子 20261006 ✓（可复现 ✓）
