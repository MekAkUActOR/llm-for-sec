### ═══ M4-B 格：**轴 1 单独**（重配比 ✓，epoch 保持 1.0 ✓）═══
#
# ★ 目的：与 A 格（m4-capfix-full ✓）**只差一个变量**（dataset ✓）⇒ **净效应可归因** ✓
#   A 格 = sec_dpo_m4_capfix × epoch 1.0  （已完成 ✗，终点 chosen −3.626 ✗）
#   **B 格 = sec_dpo_m4_rebal  × epoch 1.0**  ← 本配置 ✓
#   C 格 = sec_dpo_m4_capfix × epoch 0.1   （待 step_scan 定 epoch ✗）
#   D 格 = sec_dpo_m4_rebal  × epoch 0.1   （待 step_scan 定 epoch ✗）
