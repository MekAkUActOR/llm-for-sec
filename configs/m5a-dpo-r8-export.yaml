# m5a-dpo-r8-export = LoRA 合并件（r8 训练后、门禁前；r7 同款机械步骤）。
# 动机：finetuning_type: lora 产物 = adapter；门禁仪器（冻结 sha）仅 AutoModelForCausalLM
# 直载 ⇒ 须合并成完整模型目录。键名照抄 examples/merge_lora/qwen3_lora_sft.yaml；
# infer_dtype 显式 bfloat16（auto 落 fp32 会超 31GB RAM；门禁侧亦 bf16 加载口径一致）；
# export_device cpu（零 GPU 占用，不与 Guard/在跑链冲突）。
# 底座 = ModelScope 本地对齐快照（本地路径直载，不走 HF 缓存解析）。
model_name_or_path: J:\Projects\llm_for_sec\.cache\modelscope-dl\models\Qwen--Qwen3-8B\snapshots\master
adapter_name_or_path: J:\Projects\llm_for_sec\checkpoints\qwen3-8b-sec-m5a-dpo-r8
template: qwen3_nothink

export_dir: J:\Projects\llm_for_sec\checkpoints\qwen3-8b-sec-m5a-dpo-r8-merged
export_size: 5
export_device: cpu
export_legacy_format: false
infer_dtype: bfloat16
