# v2.2 config: arch four-increment integration run (16:37 ruling), each
# increment maps to one task's fix (attribution readability):
#   1. T1 weight 2.0 -> 1.4 (T2's fix: the 2.0 hedge premise -- "counter-
#      weight comes from data not downweighting" -- EXPIRED now that 26k T1
#      supervision landed; three-run T2 erosion -11.2/-17.1/-26.1 is the
#      interaction evidence; gradient-volume argument: T1 fix is data-driven
#      and should hold at 1.4)
#   2. T6 structural separation (T6's fix): joint trains T1-T5 only; T6
#      head trains post-hoc on the frozen adapted trunk, init from v2's
#      healthy T6 head (3/3 ep2 deaths under joint dynamics vs zero
#      historical head-only deaths)
#   3. T4 staging deploy (T4's fix): t4-lawful-v2 1,300 + mirror 300
#      (dataeng landed in manifest 11:38 -- the only untouched lever on
#      the 9.5-16x dual-gate gap)
#   4. T2 post-hoc head refresh = pre-authorized FALLBACK (not in this
#      run; triggered only if T2 < 0.9 after 1+3)
base:
  model_name_or_path: checkpoints/qwen3-06b-sec-m5a-dpo-r5
  dtype: bf16
probe:
  tapped_layers: [4, 12, 20, 24, 28]
  token_layers: [12, 28]
  heads:
    T1: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T2: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T3: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T4:
      type: pii-dual
      doc: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
      bio: {type: token-bio, dims: [2048, 512, 23], entity_types: 11, span_merge: bio-consecutive}
      input: L12+L28-per-token-concat
      flag_rule: doc_head_or_spans_nonempty
    T5: {type: seq-mlp, dims: [1024, 256, 2], classes: 2}
    T6: {type: seq-mlp, dims: [1024, 256, 3], classes: 3}
  aux_ood:
    mechanism: mahalanobis
    classes: [benign, attack]
    feature: trunk_output
    fit_on: train
    lambda: 0.1
  loss:
    # increment 1: T1 2.0 -> 1.4 (T2 erosion fix). T2 1.4 / T3 1.7 / T4 1.0
    # / T5 1.3 / T6 1.0 unchanged (T6 trains separately now; its weight is
    # unused in the joint loss)
    task_weights: {T1: 1.4, T2: 1.4, T3: 1.7, T4: 1.0, T5: 1.3, T6: 1.0}
    bio_weight: 2.0
    bio_pos_weight: 15.0
    label_masking: true
run_id: m6-v2-2
data:
  manifest: data/m6/manifest.json
  prefix_rows: exclude
  seed: 42
train:
  max_epochs: 5
  learning_rate: 0.001
  optimizer: adamw
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 16
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  early_stop_patience: 2
  bio_max_tokens: 512
  extract_batch_rows: 16
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    lr: 0.0001
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    layer_from: 14
    layer_to: 28
    lora_bio_extra_rows: 2
    # increment 2: T6 structural separation
    t6_separate: true
    t6_init_from: checkpoints/m6-v2/probe-heads.pt
  lora_center_max_rows: 3000
  # plane-consistent guard baseline (v2 weights re-measured on the FINAL
  # v2.2 data plane -- train 64,070 / dev 12,768, post-T4-wave; logit
  # domain; outputs/m6/_v2_newplane/newplane_baseline.json). The 300
  # lawful-pii mirror rows hardened BOTH T1 (0.2121 -> 0.0135) and T4
  # (0.9651 -> 0.8692) planes. T6 excluded from the per-epoch guard under
  # t6_separate (entry kept for the record).
  baseline_readings: {T1: 0.0135, T2: 0.9861, T3: 0.8396, T4: 0.8692, T5: 1.0, T6: 1.0}
output_dir: checkpoints/m6-v2-2
notes: 'v2.2 = arch four-increment integration (T1 1.4 + T6 separation +
  T4 staging wave + T2-refresh fallback pre-authorized); guard vs v2 on the
  v2.2 plane (remeasure pending); full feature re-extract REQUIRED (T4 wave
  rows); OOD telemetry three items into the readings package'
