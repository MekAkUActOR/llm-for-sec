model_name_or_path: J:\Projects\llm_for_sec\checkpoints\soup-needlefix-a050
stage: dpo
do_train: true
finetuning_type: full
template: qwen3_nothink

dataset_dir: J:\Projects\llm_for_sec\data\m5-run
dataset: sec_dpo_m5_calib
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 0

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-6
# ★ 探针：300 步 ≈ 1/7 epoch（M5 全量为 2,163 步 = 34,602/16 ✓；m4 基线口径 1,803 步）
max_steps: 300
lr_scheduler_type: cosine
warmup_steps: 20
weight_decay: 0.0
optim: adamw_bnb_8bit
gradient_checkpointing: false

pref_loss: sigmoid
pref_beta: 0.1

bf16: true
logging_steps: 5
save_steps: 50
save_total_limit: 8
plot_loss: true
report_to: none
output_dir: J:\Projects\llm_for_sec\checkpoints\qwen3-06b-sec-m5-calib-probe
