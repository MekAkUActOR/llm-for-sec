[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secfm"
version = "0.1.0"
description = "安全感知基座模型工具链：载体序列化、上下文协议、评估骨架、底座审计"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audit = ["transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["secfm*"]
